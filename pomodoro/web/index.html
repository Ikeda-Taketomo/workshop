<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="app-shell">
    <section class="timer-card" aria-labelledby="app-title">
      <header class="window-header">
        <h1 id="app-title">ポモドーロタイマー</h1>
        <div class="window-controls" aria-label="ウィンドウ操作">
          <button type="button" aria-label="最小化">−</button>
          <button type="button" aria-label="最大化">□</button>
          <button type="button" aria-label="閉じる">×</button>
        </div>
      </header>

      <nav class="mode-tabs" aria-label="タイマーモード">
        <button class="mode-tab is-active" type="button" data-mode="focus">作業中</button>
        <button class="mode-tab" type="button" data-mode="shortBreak">短い休憩</button>
        <button class="mode-tab" type="button" data-mode="longBreak">長い休憩</button>
      </nav>

      <section class="timer-panel" aria-label="タイマー">
        <p id="mode-label" class="mode-label">作業中</p>
        <div id="timer-ring" class="timer-ring" style="--progress: 30deg;">
          <div class="timer-face">
            <output id="timer-display" class="timer-display" aria-live="off">25:00</output>
          </div>
        </div>
        <p id="timer-status" class="sr-only" aria-live="polite">停止中</p>
        <div class="timer-actions">
          <button id="start-button" class="button button-primary" type="button">開始</button>
          <button id="reset-button" class="button button-secondary" type="button">リセット</button>
        </div>
      </section>

      <section class="progress-panel" aria-labelledby="progress-title">
        <h2 id="progress-title">今日の進捗</h2>
        <div class="progress-metrics">
          <div>
            <strong id="completed-count">0</strong>
            <span>完了</span>
          </div>
          <div>
            <strong id="focus-duration">0時間00分</strong>
            <span>集中時間</span>
          </div>
        </div>
      </section>

      <section class="gamification-panel" aria-labelledby="gamification-title">
        <div id="achievement-feedback" class="achievement-feedback" hidden></div>
        <div class="gamification-header">
          <div>
            <h2 id="gamification-title">継続の記録</h2>
            <p class="gamification-caption">XP・レベル・バッジで継続を見える化</p>
          </div>
          <div class="level-chip">
            <span>Lv.</span>
            <strong id="level-value">1</strong>
          </div>
        </div>
        <div class="gamification-metrics">
          <div class="metric-card">
            <strong id="xp-value">0 XP</strong>
            <span>経験値</span>
          </div>
          <div class="metric-card">
            <strong id="streak-value">0日</strong>
            <span>ストリーク</span>
          </div>
        </div>
        <div class="level-progress" aria-label="レベル進捗">
          <div id="level-progress-bar" class="level-progress-bar" style="width: 0%;"></div>
        </div>
        <p id="level-progress-text" class="level-progress-text">次のレベルまであと100 XP</p>

        <section class="badge-panel" aria-labelledby="badge-title">
          <h3 id="badge-title">達成バッジ</h3>
          <ul id="badge-list" class="badge-list"></ul>
        </section>

        <section class="stats-panel" aria-labelledby="stats-title">
          <h3 id="stats-title">統計</h3>
          <div class="stats-grid">
            <article class="stats-card" aria-labelledby="weekly-stats-title">
              <h4 id="weekly-stats-title">週間</h4>
              <dl>
                <div><dt>完了回数</dt><dd id="weekly-completed">0回</dd></div>
                <div><dt>完了率</dt><dd id="weekly-rate">0%</dd></div>
                <div><dt>平均集中時間</dt><dd id="weekly-average">0分</dd></div>
              </dl>
            </article>
            <article class="stats-card" aria-labelledby="monthly-stats-title">
              <h4 id="monthly-stats-title">月間</h4>
              <dl>
                <div><dt>完了回数</dt><dd id="monthly-completed">0回</dd></div>
                <div><dt>完了率</dt><dd id="monthly-rate">0%</dd></div>
                <div><dt>平均集中時間</dt><dd id="monthly-average">0分</dd></div>
              </dl>
            </article>
          </div>
        </section>
      </section>

      <details class="settings-panel">
        <summary>設定</summary>
        <div class="settings-grid">
          <label>作業時間（分）<input id="focus-duration-input" type="number" min="1" max="180" value="25"></label>
          <label>短い休憩（分）<input id="short-break-input" type="number" min="1" max="60" value="5"></label>
          <label>長い休憩（分）<input id="long-break-input" type="number" min="1" max="60" value="15"></label>
          <label>長い休憩まで<input id="long-break-interval-input" type="number" min="1" max="12" value="4"></label>
        </div>
        <p id="settings-error" class="settings-error" role="alert"></p>
        <button id="save-settings-button" class="button button-secondary" type="button">設定を保存</button>
        <button id="notification-button" class="button button-secondary" type="button">通知を有効化</button>
      </details>

      <section class="task-panel" aria-labelledby="task-title">
        <h2 id="task-title">タスク</h2>
        <form id="task-form" class="task-form">
          <label class="sr-only" for="task-input">タスク名</label>
          <input id="task-input" type="text" maxlength="120" placeholder="集中するタスクを入力">
          <button class="button button-secondary" type="submit">追加</button>
        </form>
        <ul id="task-list" class="task-list"></ul>
      </section>

      <section class="history-panel" aria-labelledby="history-title">
        <h2 id="history-title">セッション履歴</h2>
        <ul id="session-history" class="session-history"></ul>
      </section>

      <p id="app-status" class="sr-only">読み込み中</p>
    </section>
  </main>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
