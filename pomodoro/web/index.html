<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="app-shell">
    <section class="timer-card" aria-labelledby="app-title">
      <header class="window-header">
        <h1 id="app-title">ポモドーロタイマー</h1>
        <div class="window-controls" aria-label="ウィンドウ操作">
          <button type="button" aria-label="最小化">−</button>
          <button type="button" aria-label="最大化">□</button>
          <button type="button" aria-label="閉じる">×</button>
        </div>
      </header>

      <nav class="mode-tabs" aria-label="タイマーモード">
        <button class="mode-tab is-active" type="button" data-mode="focus">作業中</button>
        <button class="mode-tab" type="button" data-mode="shortBreak">短い休憩</button>
        <button class="mode-tab" type="button" data-mode="longBreak">長い休憩</button>
      </nav>

      <section class="timer-panel" aria-label="タイマー">
        <p id="mode-label" class="mode-label">作業中</p>
        <div id="timer-ring" class="timer-ring" style="--progress: 360deg; --timer-hue: 210;">
          <div class="timer-face">
            <output id="timer-display" class="timer-display" aria-live="off">25:00</output>
          </div>
        </div>
        <p id="timer-status" class="sr-only" aria-live="polite">停止中</p>
        <div class="timer-actions">
          <button id="start-button" class="button button-primary" type="button">開始</button>
          <button id="reset-button" class="button button-secondary" type="button">リセット</button>
        </div>
      </section>

      <section class="progress-panel" aria-labelledby="progress-title">
        <h2 id="progress-title">今日の進捗</h2>
        <div class="progress-metrics">
          <div>
            <strong id="completed-count">0</strong>
            <span>完了</span>
          </div>
          <div>
            <strong id="focus-duration">0時間00分</strong>
            <span>集中時間</span>
          </div>
        </div>
      </section>

      <details class="settings-panel">
        <summary>設定</summary>
        <div class="settings-grid">
          <label>集中時間
            <select id="focus-duration-input" data-setting-control>
              <option value="15">15分</option>
              <option value="25" selected>25分</option>
              <option value="35">35分</option>
              <option value="45">45分</option>
            </select>
          </label>
          <label>短い休憩
            <select id="short-break-input" data-setting-control>
              <option value="5" selected>5分</option>
              <option value="10">10分</option>
              <option value="15">15分</option>
            </select>
          </label>
          <label>長い休憩
            <select id="long-break-input" data-setting-control>
              <option value="5">5分</option>
              <option value="10">10分</option>
              <option value="15" selected>15分</option>
            </select>
          </label>
          <label>テーマ
            <select id="theme-input" data-setting-control>
              <option value="light" selected>ライト</option>
              <option value="dark">ダーク</option>
              <option value="focus">フォーカスモード</option>
            </select>
          </label>
          <label>長い休憩まで<input id="long-break-interval-input" type="number" min="1" max="12" value="4" data-setting-control></label>
        </div>
        <fieldset class="sound-settings">
          <legend>サウンド</legend>
          <label><input id="start-sound-input" type="checkbox" checked data-setting-control>開始音</label>
          <label><input id="end-sound-input" type="checkbox" checked data-setting-control>終了音</label>
          <label><input id="tick-sound-input" type="checkbox" data-setting-control>tick 音</label>
        </fieldset>
        <div class="settings-actions">
          <button id="save-settings-button" class="button button-secondary" type="button">設定を保存</button>
          <button id="notification-button" class="button button-secondary" type="button">通知を有効化</button>
        </div>
        <p id="settings-error" class="settings-error" role="alert"></p>
      </details>

      <section class="task-panel" aria-labelledby="task-title">
        <h2 id="task-title">タスク</h2>
        <form id="task-form" class="task-form">
          <label class="sr-only" for="task-input">タスク名</label>
          <input id="task-input" type="text" maxlength="120" placeholder="集中するタスクを入力">
          <button class="button button-secondary" type="submit">追加</button>
        </form>
        <ul id="task-list" class="task-list"></ul>
      </section>

      <section class="history-panel" aria-labelledby="history-title">
        <h2 id="history-title">セッション履歴</h2>
        <ul id="session-history" class="session-history"></ul>
      </section>

      <p id="app-status" class="sr-only">読み込み中</p>
    </section>
  </main>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
